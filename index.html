<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>خطة هندسة وأمن شبكات الحاسوب | NES Plan Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body.dark-mode {
      --bg-color: #080c14;
      --viewport-bg: radial-gradient(circle at center, #111827 0%, #080c14 100%);
      --panel-bg: rgba(17, 24, 39, 0.92);
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --node-solid-fill: #111827;
      --node-text: #f1f5f9;
      --link-color: #475569;
      --glow-intensity: 12px;
      --modal-bg: #1e293b;
      --btn-bg: #334155;

      --c-completed-bg: #064e3b;
      --c-completed-text: #ffffff;
      --c-current-bg: #1e3a8a;
      --c-current-text: #ffffff;
      --c-next-bg: #78350f;
      --c-next-text: #ffffff;
      --c-summer-bg: #831843;
      --c-summer-text: #ffffff;
      --c-next-year-bg: #581c87;
      --c-next-year-text: #ffffff;
      --c-term-2028-bg: #164e63;
      --c-term-2028-text: #ffffff;
    }

    body.light-mode {
      --bg-color: #f1f5f9;
      --viewport-bg: radial-gradient(circle at center, #ffffff 0%, #e2e8f0 100%);
      --panel-bg: rgba(255, 255, 255, 0.95);
      --card-bg: #ffffff;
      --border-color: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --node-solid-fill: #ffffff;
      --node-text: #0f172a;
      --link-color: #94a3b8;
      --glow-intensity: 7px;
      --modal-bg: #ffffff;
      --btn-bg: #f1f5f9;

      --c-completed-bg: #d1fae5;
      --c-completed-text: #065f46;
      --c-current-bg: #dbeafe;
      --c-current-text: #1e40af;
      --c-next-bg: #fef3c7;
      --c-next-text: #92400e;
      --c-summer-bg: #fce7f3;
      --c-summer-text: #9d174d;
      --c-next-year-bg: #ede9fe;
      --c-next-year-text: #5b21b6;
      --c-term-2028-bg: #cffafe;
      --c-term-2028-text: #155e75;
    }

    * { box-sizing: border-box; user-select: none; -webkit-touch-callout: none; }
    
    body[dir="rtl"], body[dir="rtl"] * {
      font-family: 'Farah', 'Almarai', 'Segoe UI', Tahoma, sans-serif;
    }
    body[dir="ltr"], body[dir="ltr"] * {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-color); color: var(--text-main); transition: background-color 0.3s; touch-action: none; }

    #dashboard {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 100;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 12px 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .dash-header h2 { margin: 0; font-size: 1.15rem; color: #38bdf8; }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toggle-btn {
      background: var(--btn-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s;
    }
    .toggle-btn:hover { border-color: #38bdf8; color: #38bdf8; }

    .stats-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.78rem;
      align-items: center;
    }
    .stat-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 700;
    }
    .badge-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

    .progress-bar-bg {
      width: 100%;
      height: 7px;
      background: var(--border-color);
      border-radius: 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #06b6d4);
      box-shadow: 0 0 10px #10b981;
      transition: width 0.3s ease;
    }

    #viewport {
      width: 100vw;
      height: 100vh;
      cursor: grab;
      overflow: hidden;
      background: var(--viewport-bg);
    }
    #viewport:active { cursor: grabbing; }

    svg#canvas { width: 100%; height: 100%; display: block; }

    .link-solid { stroke: var(--link-color); stroke-width: 2.4; fill: none; transition: stroke 0.2s; }
    .link-dashed { stroke: var(--link-color); stroke-width: 2.4; stroke-dasharray: 6,6; fill: none; transition: stroke 0.2s; }

    .node-group { cursor: pointer; }
    
    .node-mask {
      fill: var(--node-solid-fill);
      stroke: none;
      transition: fill 0.25s ease;
    }

    .node-circle {
      fill: transparent;
      stroke-width: 3.5px;
      transition: all 0.25s ease;
    }
    .status-ring {
      fill: none;
      stroke-width: 0px;
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .node-text {
      font-size: 11px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
      fill: var(--node-text);
      pointer-events: none;
      transition: fill 0.25s ease;
    }
    .node-credits {
      font-size: 10.5px;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: central;
      fill: #38bdf8;
      pointer-events: none;
    }

    .status-completed .status-ring { stroke: #10b981; stroke-width: 5px; filter: drop-shadow(0 0 var(--glow-intensity) #10b981); }
    .status-completed .node-mask { fill: var(--c-completed-bg); }
    .status-completed .node-text { fill: var(--c-completed-text) !important; }

    .status-current .status-ring { stroke: #3b82f6; stroke-width: 5px; filter: drop-shadow(0 0 var(--glow-intensity) #3b82f6); }
    .status-current .node-mask { fill: var(--c-current-bg); }
    .status-current .node-text { fill: var(--c-current-text); }

    .status-next .status-ring { stroke: #f59e0b; stroke-width: 5px; filter: drop-shadow(0 0 var(--glow-intensity) #f59e0b); }
    .status-next .node-mask { fill: var(--c-next-bg); }
    .status-next .node-text { fill: var(--c-next-text); }

    .status-summer .status-ring { stroke: #ec4899; stroke-width: 5px; filter: drop-shadow(0 0 var(--glow-intensity) #ec4899); }
    .status-summer .node-mask { fill: var(--c-summer-bg); }
    .status-summer .node-text { fill: var(--c-summer-text); }

    .status-next-year .status-ring { stroke: #a855f7; stroke-width: 5px; filter: drop-shadow(0 0 var(--glow-intensity) #a855f7); }
    .status-next-year .node-mask { fill: var(--c-next-year-bg); }
    .status-next-year .node-text { fill: var(--c-next-year-text); }

    .status-term-2028 .status-ring { stroke: #06b6d4; stroke-width: 5px; filter: drop-shadow(0 0 var(--glow-intensity) #06b6d4); }
    .status-term-2028 .node-mask { fill: var(--c-term-2028-bg); }
    .status-term-2028 .node-text { fill: var(--c-term-2028-text); }

    #actionModal {
      position: absolute;
      display: none;
      z-index: 200;
      background: var(--modal-bg);
      border-radius: 14px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.5);
      border: 1px solid var(--border-color);
      padding: 14px;
      width: 250px;
    }
    #actionModal h4 { margin: 0 0 10px 0; font-size: 0.95rem; color: #38bdf8; text-align: center; }
    .btn-status {
      display: block;
      width: 100%;
      text-align: inherit;
      padding: 8px 12px;
      margin-bottom: 6px;
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 0.83rem;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.1s;
    }
    .btn-status:active { transform: scale(0.98); }
    .btn-completed { background: rgba(16, 185, 129, 0.2); color: #10b981; border-color: #10b981; }
    .btn-current { background: rgba(59, 130, 246, 0.2); color: #3b82f6; border-color: #3b82f6; }
    .btn-next { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border-color: #f59e0b; }
    .btn-summer { background: rgba(236, 72, 153, 0.2); color: #ec4899; border-color: #ec4899; }
    .btn-next-year { background: rgba(168, 85, 247, 0.2); color: #a855f7; border-color: #a855f7; }
    .btn-term-2028 { background: rgba(6, 182, 212, 0.2); color: #06b6d4; border-color: #06b6d4; }
    .btn-reset { background: var(--btn-bg); color: var(--text-muted); }

    .legend-box {
      position: absolute;
      bottom: 15px;
      right: 15px;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      padding: 10px 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 100;
    }
    body[dir="ltr"] .legend-box { right: auto; left: 15px; }
    .legend-item { display: flex; align-items: center; gap: 8px; }

    @media (max-width: 768px) {
      #dashboard { padding: 10px 14px; }
      .dash-header h2 { font-size: 1rem; }
      .stats-row { font-size: 0.72rem; gap: 8px; }
      .legend-box { display: none; }
      #actionModal {
        position: fixed;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%);
        width: 85vw;
        max-width: 320px;
      }
    }
  </style>
</head>
<body class="dark-mode" dir="rtl">

  <div class="legend-box">

    const links = [
      { from: "prog1", to: "oop", type: "solid" },
      { from: "oop", to: "ds", type: "solid" },
      { from: "oop", to: "db", type: "solid" },
      { from: "calc1", to: "calc2", type: "solid" },
      { from: "phys1", to: "phys2", type: "solid" },

      { from: "calc2", to: "inter_calc", type: "solid" },
      { from: "phys2", to: "circuits", type: "solid" },
      { from: "circuits", to: "diff_eq", type: "dashed" },
      { from: "prog1", to: "dig_logic", type: "solid" },
      { from: "circuits", to: "elec_fund", type: "solid" },
      { from: "circuits", to: "sig_sys", type: "solid" },
      { from: "circuits", to: "circ_lab", type: "dashed" },
      { from: "dig_logic", to: "logic_lab", type: "dashed" },
      { from: "dig_logic", to: "comp_org", type: "solid" },
      { from: "comp_org", to: "comp_arch", type: "solid" },
      { from: "sig_sys", to: "data_comm", type: "dashed" },
      { from: "comp_org", to: "micro_sys", type: "solid" },
      { from: "micro_sys", to: "micro_lab", type: "dashed" },
      { from: "comp_arch", to: "os", type: "solid" },
      { from: "data_comm", to: "net_fund", type: "solid" },
      { from: "net_fund", to: "crypto", type: "solid" },
      { from: "crypto", to: "sec_lab", type: "dashed" },
      { from: "crypto", to: "net_sec", type: "solid" },
      { from: "net_sec", to: "net_sec_lab", type: "dashed" },
      { from: "net_sec", to: "eth_hack", type: "solid" },
      { from: "net_fund", to: "net_proto", type: "solid" },
      { from: "net_fund", to: "wireless", type: "solid" },
      { from: "net_fund", to: "net_lab", type: "dashed" },
      { from: "ds", to: "net_prog", type: "solid" },
      { from: "unix", to: "net_prog", type: "dashed" },
      { from: "crypto", to: "dig_foren", type: "solid" },
      { from: "net_sec", to: "net_protect", type: "solid" },

      { from: "net_proto", to: "multimedia", type: "solid" },
      { from: "wireless", to: "wire_lab", type: "dashed" },
      { from: "wireless", to: "iot", type: "solid" },
      { from: "proj1", to: "proj2", type: "dashed" }
    ];

    let userState = JSON.parse(localStorage.getItem('study_graph_state_v5') || '{}');
    let activeCourseId = null;

    const scene = document.getElementById('scene');
    const nodesMap = {};
    nodes.forEach(n => nodesMap[n.id] = n);

    function isMobileDevice() {
      return (window.innerWidth <= 768) || ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    }

    function applyLangUI() {
      const t = translations[currentLang];
      document.documentElement.lang = currentLang;
      document.body.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');

      document.getElementById('lblTitle').innerText = t.title;
      document.getElementById('themeBtn').innerText = currentTheme === 'dark' ? t.themeBtnLight : t.themeBtnDark;
      document.getElementById('langBtn').innerText = t.langBtn;
      document.getElementById('lblProgress').innerText = t.progress;
      document.getElementById('lblHoursUnit').innerText = t.hoursUnit;
      document.getElementById('lblCoursesUnit').innerText = t.coursesUnit;
      document.getElementById('lblStatusCompleted').innerText = t.stCompleted;
      document.getElementById('lblStatusCurrent').innerText = t.stCurrent;
      document.getElementById('lblStatusNext').innerText = t.stNext;
      document.getElementById('lblStatusSummer').innerText = t.stSummer;
      document.getElementById('lblStatusNextYear').innerText = t.stNextYear;
      document.getElementById('lblStatusTerm2028').innerText = t.stTerm2028;
      
      document.getElementById('lblControlsHint').innerText = isMobileDevice() ? t.hintMobile : t.hintPC;

      document.getElementById('lblLegendTitle').innerText = t.legTitle;
      document.getElementById('lblPrereqPass').innerText = t.legPass;
      document.getElementById('lblPrereqStudy').innerText = t.legStudy;

      document.getElementById('btnMCompleted').innerText = t.mComp;
      document.getElementById('btnMCurrent').innerText = t.mCurr;
      document.getElementById('btnMNext').innerText = t.mNext;
      document.getElementById('btnMSummer').innerText = t.mSumm;
      document.getElementById('btnMNextYear').innerText = t.mNY;
      document.getElementById('btnMTerm2028').innerText = t.mTerm28;
      document.getElementById('btnMReset').innerText = t.mReset;
    }

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.body.className = `${currentTheme}-mode`;
      localStorage.setItem('study_theme', currentTheme);
      applyLangUI();
    }

    function toggleLang() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      localStorage.setItem('study_lang', currentLang);
      applyLangUI();
      renderDiagram();
    }

    function renderDiagram() {
      scene.innerHTML = '';

      links.forEach(l => {
        const source = nodesMap[l.from];
        const target = nodesMap[l.to];
        if (!source || !target) return;

        const dx = target.x - source.x;
        const dy = target.y - source.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist === 0) return;

        const x1 = source.x + (dx / dist) * ringRadius;
        const y1 = source.y + (dy / dist) * ringRadius;
        const x2 = target.x - (dx / dist) * (ringRadius + 5);
        const y2 = target.y - (dy / dist) * (ringRadius + 5);

        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", x1);
        line.setAttribute("y1", y1);
        line.setAttribute("x2", x2);
        line.setAttribute("y2", y2);
        line.setAttribute("class", l.type === 'dashed' ? 'link-dashed' : 'link-solid');
        line.setAttribute("marker-end", l.type === 'dashed' ? 'url(#arrow-dashed)' : 'url(#arrow-solid)');
        scene.appendChild(line);
      });

      const t = translations[currentLang];
      nodes.forEach(n => {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("class", `node-group status-${userState[n.id] || 'none'}`);
        g.setAttribute("id", `node-${n.id}`);

        let pressTimer = null;
        let isLongPress = false;

        const startPress = (clientX, clientY) => {
          isLongPress = false;
          pressTimer = setTimeout(() => {
            isLongPress = true;
            if (navigator.vibrate) navigator.vibrate(40);
            openModal(clientX, clientY, n);
          }, 450);
        };

        const cancelPress = () => {
          if (pressTimer) clearTimeout(pressTimer);
        };

        g.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            const touch = e.touches[0];
            startPress(touch.clientX, touch.clientY);
          }
        }, { passive: true });

        g.addEventListener('touchmove', cancelPress, { passive: true });

        g.addEventListener('touchend', (e) => {
          cancelPress();
          if (!isLongPress && e.changedTouches.length === 1) {
            toggleComplete(n.id);
          }
        });

        g.onclick = (e) => {
          e.stopPropagation();
          toggleComplete(n.id);
        };

        g.oncontextmenu = (e) => {
          e.preventDefault();
          e.stopPropagation();
          openModal(e.clientX, e.clientY, n);
        };

        const ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        ring.setAttribute("cx", n.x);
        ring.setAttribute("cy", n.y);
        ring.setAttribute("r", ringRadius);
        ring.setAttribute("class", "status-ring");
        g.appendChild(ring);

        const mask = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        mask.setAttribute("cx", n.x);
        mask.setAttribute("cy", n.y);
        mask.setAttribute("r", nodeRadius);
        mask.setAttribute("class", "node-mask");
        g.appendChild(mask);

        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("cx", n.x);
        circle.setAttribute("cy", n.y);
        circle.setAttribute("r", nodeRadius);
        circle.setAttribute("class", "node-circle");
        circle.setAttribute("stroke", n.stroke);
        g.appendChild(circle);

        const nameText = currentLang === 'ar' ? n.name_ar : n.name_en;
        const lines = nameText.split('\n');
        const lineHeight = 12.5;
        const startY = n.y - ((lines.length) * lineHeight) / 2;

        lines.forEach((txt, idx) => {
          const textEl = document.createElementNS("http://www.w3.org/2000/svg", "text");
          textEl.setAttribute("x", n.x);
          textEl.setAttribute("y", startY + (idx * lineHeight));
          textEl.setAttribute("class", "node-text");
          textEl.textContent = txt;
          g.appendChild(textEl);
        });

        const crEl = document.createElementNS("http://www.w3.org/2000/svg", "text");
        crEl.setAttribute("x", n.x);
        crEl.setAttribute("y", n.y + 28);
        crEl.setAttribute("class", "node-credits");
        crEl.textContent = `${n.cr} ${t.crSuffix}`;
        g.appendChild(crEl);

        scene.appendChild(g);
      });

      updateStats();
    }

    function toggleComplete(courseId) {
      const currentStatus = userState[courseId];
      const newStatus = (currentStatus === 'completed') ? 'none' : 'completed';
      activeCourseId = courseId;
      setCourseStatus(newStatus);
    }

    const modal = document.getElementById('actionModal');
    function openModal(clientX, clientY, node) {
      activeCourseId = node.id;
      const title = currentLang === 'ar' ? node.name_ar.replace(/\n/g, ' ') : node.name_en.replace(/\n/g, ' ');
      document.getElementById('modalCourseTitle').textContent = `${title} (${node.cr} ${translations[currentLang].crSuffix})`;

      modal.style.display = 'block';

      if (window.innerWidth > 768) {
        let left = clientX + 10;
        let top = clientY + 10;
        if (left + 270 > window.innerWidth) left = clientX - 270;
        if (top + 340 > window.innerHeight) top = clientY - 340;
        modal.style.left = left + 'px';
        modal.style.top = top + 'px';
      }
    }

    window.onclick = function(e) {
      if (!e.target.closest('#actionModal')) {
        modal.style.display = 'none';
      }
    };

    window.addEventListener('touchstart', (e) => {
      if (!e.target.closest('#actionModal') && !e.target.closest('.node-group')) {
        modal.style.display = 'none';
      }
    }, { passive: true });

    function setCourseStatus(status) {
      if (!activeCourseId) return;
      if (status === 'none') {
        delete userState[activeCourseId];
      } else {
        userState[activeCourseId] = status;
      }
      localStorage.setItem('study_graph_state_v5', JSON.stringify(userState));

      const nodeEl = document.getElementById(`node-${activeCourseId}`);
      if (nodeEl) {
        nodeEl.setAttribute('class', `node-group status-${status}`);
      }

      updateStats();
      modal.style.display = 'none';
    }

    function updateStats() {
      const counts = { completed: 0, current: 0, next: 0, summer: 0, nextYear: 0, term2028: 0 };
      const hours = { completed: 0, current: 0, next: 0, summer: 0, nextYear: 0, term2028: 0 };
      const totalDegreeHours = 160;

      nodes.forEach(n => {
        const s = userState[n.id];
        if (s && counts[s] !== undefined) {
          counts[s]++;
          hours[s] += n.cr;
        } else if (s === 'next-year') {
          counts.nextYear++;
          hours.nextYear += n.cr;
        } else if (s === 'term-2028') {
          counts.term2028++;
          hours.term2028 += n.cr;
        }
      });

      const t = translations[currentLang];
      document.getElementById('totalCourses').innerText = nodes.length;
      document.getElementById('completedCourses').innerText = counts.completed;
      document.getElementById('totalHours').innerText = totalDegreeHours;
      document.getElementById('completedHours').innerText = hours.completed;

      document.getElementById('count-completed').innerText = `${hours.completed} ${t.crSuffix} (${counts.completed})`;
      document.getElementById('count-current').innerText = `${hours.current} ${t.crSuffix} (${counts.current})`;
      document.getElementById('count-next').innerText = `${hours.next} ${t.crSuffix} (${counts.next})`;
      document.getElementById('count-summer').innerText = `${hours.summer} ${t.crSuffix} (${counts.summer})`;
      document.getElementById('count-next-year').innerText = `${hours.nextYear} ${t.crSuffix} (${counts.nextYear})`;
      document.getElementById('count-term-2028').innerText = `${hours.term2028} ${t.crSuffix} (${counts.term2028})`;

      const pct = Math.round((hours.completed / totalDegreeHours) * 100);
      document.getElementById('pctText').innerText = pct + '%';
      document.getElementById('progressBar').style.width = pct + '%';
    }

    let isPanning = false;
    let startX = 0, startY = 0;
    let currentX = 15, currentY = 100, scale = 0.65;
    let initialPinchDist = null;
    let initialPinchScale = 1;

    function applyTransform() {
      scene.setAttribute("transform", `translate(${currentX}, ${currentY}) scale(${scale})`);
    }

    const viewport = document.getElementById('viewport');

    viewport.addEventListener('mousedown', (e) => {
      if (e.target.closest('.node-group') || e.button !== 0) return;
      isPanning = true;
      startX = e.clientX - currentX;
      startY = e.clientY - currentY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      currentX = e.clientX - startX;
      currentY = e.clientY - startY;
      applyTransform();
    });

    window.addEventListener('mouseup', () => { isPanning = false; });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      scale = Math.min(Math.max(0.25, scale * zoomFactor), 2.5);
      applyTransform();
    }, { passive: false });

    viewport.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1 && !e.target.closest('.node-group')) {
        isPanning = true;
        startX = e.touches[0].clientX - currentX;
        startY = e.touches[0].clientY - currentY;
      } else if (e.touches.length === 2) {
        isPanning = false;
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialPinchScale = scale;
      }
    }, { passive: false });

    viewport.addEventListener('touchmove', (e) => {
      if (isPanning && e.touches.length === 1) {
        currentX = e.touches[0].clientX - startX;
        currentY = e.touches[0].clientY - startY;
        applyTransform();
      } else if (e.touches.length === 2 && initialPinchDist) {
        e.preventDefault();
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = dist / initialPinchDist;
        scale = Math.min(Math.max(0.25, initialPinchScale * factor), 2.5);
        applyTransform();
      }
    }, { passive: false });

    viewport.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialPinchDist = null;
      if (e.touches.length === 0) isPanning = false;
    });

    window.addEventListener('resize', () => {
      applyLangUI();
    });

    if (window.innerWidth <= 768) {
      scale = 0.45;
      currentX = 10;
      currentY = 90;
    }

    document.body.className = `${currentTheme}-mode`;
    applyLangUI();
    renderDiagram();
    applyTransform();
  </script>
